name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://buildpath:buildpath@localhost:5432/buildpath?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm run i18n:check
      - run: npm run db:validate
        env:
          DATABASE_URL: postgresql://buildpath:buildpath@localhost:5432/buildpath?schema=public
      - run: npx --yes @redocly/cli@1.34.5 lint apps/api/openapi.yaml
