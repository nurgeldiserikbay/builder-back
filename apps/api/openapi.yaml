      tags: [Journey]
      operationId: reopenStage
      summary: Reopen an accepted stage
      description: Accepted later stages become stale and must be confirmed or updated.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/StageKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JourneyResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/build:
    post:
      tags: [Journey]
      operationId: buildProjectSite
      summary: Compile the site from accepted stages and run checks
      description: Deterministic, script-free renderer; no AI and no code execution.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/preview:
    get:
      tags: [Journey]
      operationId: previewProjectSite
      summary: Render a draft preview or a saved build
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/OptionalVersionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/result:
    get:
      tags: [Journey]
      operationId: getProjectResult
      summary: Download the result package for accepted stages
      description: Available at any stage; unaccepted stages are listed as open items.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/complete:
    post:
      tags: [Journey]
      operationId: completeProject
      summary: Finish the project at its current stage
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JourneyResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/resume:
    post:
      tags: [Journey]
      operationId: resumeProject
      summary: Continue a completed project
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JourneyResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: buildpath_admin_session
    sessionCookie:
      type: apiKey
      in: cookie
      name: buildpath_session
  parameters:
    StageKey:
      in: path
      name: stageKey
      required: true
      schema: { type: string, enum: [goal, offer, content, design, build] }
    RuleId:
      in: path
      name: ruleId
      required: true
      schema: { type: string, format: uuid }
    VersionId:
      in: path
      name: versionId
      required: true
      schema: { type: string, format: uuid }
    OptionalVersionId:
      in: query
      name: versionId
      required: false
      description: Saved build version; omitted for a draft preview from the latest drafts.
      schema: { type: string, format: uuid }
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: { type: string, format: uuid }
    ReviewId:
      in: path
      name: reviewId
      required: true
      schema: { type: string, format: uuid }
    PageId:
      in: path
      name: pageId
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Replaying the same key and body returns the original result; reusing it with a different body returns 409.
      schema: { type: string, minLength: 16, maxLength: 128 }
  responses:
    Problem:
      description: RFC 9457 problem response with stable application code and request ID.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    QualityGateReport:
      type: object
      additionalProperties: false
      required: [status, profile, evaluatedAt, requirementCoverage, apiChecks, categories, blockingReasons]
      properties:
        status: { type: string, enum: [not_configured, invalid_configuration, not_assessed, blocked, passed] }
        profile:
          oneOf:
            - type: object
              additionalProperties: false
              required: [key, name, version]
              properties:
                key: { type: string, maxLength: 80 }
                name: { type: string, maxLength: 120 }
                version: { type: integer, minimum: 1 }
            - type: 'null'
        evaluatedAt: { type: string, format: date-time }
        requirementCoverage:
          type: object
          additionalProperties: false
          required: [status, actualPercent, minimumPercent]
          properties:
            status: { type: string, enum: [not_applicable, passed, blocked] }
            actualPercent: { type: [integer, 'null'], minimum: 0, maximum: 100 }
            minimumPercent: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        apiChecks:
          type: object
          additionalProperties: false
          required: [checked, failed]
          properties:
            checked: { type: integer, minimum: 0, maximum: 5000 }
            failed: { type: integer, minimum: 0, maximum: 5000 }
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, enabled, required, status, evidence, issues, reasons]
            properties:
              id: { type: string, enum: [security, accessibility, performance, seo] }
              enabled: { type: boolean }
              required: { type: boolean }
              status: { type: string, enum: [disabled, not_assessed, blocked, passed] }
              evidence:
                type: object
                additionalProperties: false
                required: [checked, total]
                properties:
                  checked: { type: integer, minimum: 0, maximum: 100 }
                  total: { type: integer, minimum: 0, maximum: 100 }
              issues:
                type: object
                additionalProperties: false
                required: [critical, high, medium, low]
                properties:
                  critical: { type: integer, minimum: 0 }
                  high: { type: integer, minimum: 0 }
                  medium: { type: integer, minimum: 0 }
                  low: { type: integer, minimum: 0 }
              reasons:
                type: array
                items: { type: string, maxLength: 80 }
        blockingReasons:
          type: array
          items: { type: string, maxLength: 120 }
    QualityProfileCreateRequest:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 500 }
        policy: { $ref: '#/components/schemas/QualityPolicy' }
    QualityPolicyRequest:
      type: object
      additionalProperties: false
      required: [policy]
      properties:
        policy: { $ref: '#/components/schemas/QualityPolicy' }
    QualityPolicy:
      type: object
      additionalProperties: false
      required: [schemaVersion, minimumRequirementCoverage, blockingSeverities, categories]
      properties:
        schemaVersion: { const: 1 }
        minimumRequirementCoverage: { type: integer, minimum: 0, maximum: 100 }
        blockingSeverities:
          type: array
          uniqueItems: true
          items: { type: string, enum: [critical, high, medium, low] }
        categories:
          type: object
          additionalProperties: false
          required: [security, accessibility, performance, seo]
          properties:
            security: { $ref: '#/components/schemas/QualityCategoryPolicy' }
            accessibility: { $ref: '#/components/schemas/QualityCategoryPolicy' }
            performance: { $ref: '#/components/schemas/QualityCategoryPolicy' }
            seo: { $ref: '#/components/schemas/QualityCategoryPolicy' }
    QualityCategoryPolicy:
      type: object
      additionalProperties: false
      required: [enabled, required, maxOpenCritical, maxOpenHigh]
      properties:
        enabled: { type: boolean }
        required: { type: boolean }
        maxOpenCritical: { type: integer, minimum: 0, maximum: 100 }
        maxOpenHigh: { type: integer, minimum: 0, maximum: 100 }
    QualityProfileVersion:
      type: object
      additionalProperties: false
      required: [version, status, policy, createdAt, activatedAt, authoredBy]
      properties:
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, active, retired] }
        policy: { $ref: '#/components/schemas/QualityPolicy' }
        createdAt: { type: string, format: date-time }
        activatedAt: { type: [string, 'null'], format: date-time }
        authoredBy: { type: [string, 'null'] }
    QualityProfile:
      type: object
      additionalProperties: false
      required: [key, name, description, isDefault, createdAt, createdBy, versions]
      properties:
        key: { type: string, maxLength: 80 }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, maxLength: 120 }
        versions:
          type: array
          items: { $ref: '#/components/schemas/QualityProfileVersion' }
    QualityProfileListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/QualityProfile' }
    QualityProfileResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/QualityProfile' }
    StaffLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
    StaffIdentityResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id, email, displayName, role]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            displayName: { type: string, maxLength: 120 }
            role: { type: string, enum: [super_admin, quality_admin, operations_auditor] }
    CapabilityManifestResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [revision, statuses, capabilities]
          properties:
            revision: { type: string, minLength: 1, maxLength: 32 }
            statuses:
              type: array
              minItems: 4
              maxItems: 4
              items:
                type: object
                additionalProperties: false
                required: [id, label, description]
                properties:
                  id: { type: string, enum: [supported, limited, docs_only, unsupported] }
                  label: { type: string, maxLength: 40 }
                  description: { type: string, maxLength: 200 }
            capabilities:
              type: array
              maxItems: 100
              items: { $ref: '#/components/schemas/CapabilityManifestEntry' }
    CapabilityManifestEntry:
      type: object
      additionalProperties: false
      required: [id, category, name, status, summary, conditions]
      properties:
        id: { type: string, pattern: '^[a-z0-9-]{2,64}$' }
        category: { type: string, minLength: 1, maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 120 }
        status: { type: string, enum: [supported, limited, docs_only, unsupported] }
        summary: { type: string, minLength: 1, maxLength: 500 }
        conditions:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 300 }
    CreateReviewRequest:
      type: object
      additionalProperties: false
      required: [title, mode, locale]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        mode: { type: string, enum: [site_only, site_and_design, design_only] }
        locale: { type: string, enum: [en, ru, kk] }
    Review:
      type: object
      additionalProperties: false
      required: [id, projectId, title, mode, status, locale, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        title: { type: string }
        mode: { type: string, enum: [site_only, site_and_design, design_only] }
        status: { type: string, enum: [draft, queued, discovering, ready, failed, cancelled] }
        locale: { type: string, enum: [en, ru, kk] }
        sourceSnapshotId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReviewResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Review' }
    RegisterReviewUrlRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
    ReviewSourceAccepted:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [jobId, status]
          properties:
            jobId: { type: string, format: uuid }
            status: { type: string, enum: [queued, running] }
    DesignUploadRequest:
      type: object
      additionalProperties: false
      required: [fileName, contentType, sizeBytes, sha256]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        contentType: { type: string, enum: [image/png, image/jpeg] }
        sizeBytes: { type: integer, minimum: 1, maximum: 20971520 }
        sha256: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
    DesignUploadResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [assetId, uploadUrl, method, expiresAt, requiredFields]
          properties:
            assetId: { type: string, format: uuid }
            uploadUrl: { type: string, format: uri }
            method: { type: string, enum: [POST] }
            expiresAt: { type: string, format: date-time }
            requiredFields:
              type: object
              additionalProperties: { type: string }
    DesignAssetResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [assetId, status]
          properties:
            assetId: { type: string, format: uuid }
            status: { type: string, enum: [verified] }
    DiscoverPagesRequest:
      type: object
      additionalProperties: false
      required: [maxPages, maxDepth]
      properties:
        maxPages: { type: integer, minimum: 1, maximum: 100, default: 30 }
        maxDepth: { type: integer, minimum: 0, maximum: 5, default: 3 }
        includeSitemap: { type: boolean, default: true }
    ReviewJobAccepted:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [jobId, status]
          properties:
            jobId: { type: string, format: uuid }
            status: { type: string, enum: [queued, running] }

    CaptureJobAccepted:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [jobId, captureId, status]
          properties:
            jobId: { type: string, format: uuid }
            captureId: { type: string, format: uuid }
            status: { type: string, enum: [queued, running, succeeded, failed] }
    PageMappingRequest:
      type: object
      additionalProperties: false
      required: [viewport, requirementIds]
      properties:
        designAssetId: { type: [string, 'null'], format: uuid }
        figmaFileKey: { type: [string, 'null'], maxLength: 128, description: Reserved for an explicitly authorized read-only Figma integration. }
        figmaNodeId: { type: [string, 'null'], maxLength: 128 }
        viewport:
          $ref: '#/components/schemas/ReviewViewport'
        requirementIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    AiDesignAnalysis:
      type: object
      additionalProperties: false
      required: [status, provider, model, createdAt, summary, findings, limitation]
      properties:
        status: { type: string, enum: [complete] }
        provider: { type: string, enum: [openai] }
        model: { type: string, maxLength: 80 }
        createdAt: { type: string, format: date-time }
        summary: { type: string, maxLength: 1200 }
        limitation: { type: string, maxLength: 500 }
        findings:
          type: array
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            required: [category, severity, confidence, summary, details, evidence]
            properties:
              category: { type: string, enum: [design] }
              severity: { type: string, enum: [critical, high, medium, low, info] }
              confidence: { type: string, enum: [low, medium, high] }
              summary: { type: string, maxLength: 300 }
              details: { type: string, maxLength: 1200 }
              evidence: { type: string, maxLength: 500 }
    ReviewViewport:
      type: object
      additionalProperties: false
      required: [width, height, deviceScale]
      properties:
        width: { type: integer, minimum: 320, maximum: 3840 }
        height: { type: integer, minimum: 568, maximum: 4320 }
        deviceScale: { type: number, minimum: 1, maximum: 3 }
    ReviewPage:
      type: object
      additionalProperties: false
      required: [id, route, label, status, designAssetId, viewport, findingCount]
      properties:
        id: { type: string, format: uuid }
        route: { type: string, maxLength: 2048 }
        label: { type: string, maxLength: 120 }
        status: { type: string, enum: [discovered, mapped, captured, needs_review, failed] }
        designAssetId: { type: [string, 'null'], format: uuid }
        viewport: { $ref: '#/components/schemas/ReviewViewport' }
        findingCount: { type: integer, minimum: 0 }
    ReviewPageResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ReviewPage' }
    ReviewPageListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ReviewPage' }
    CaptureReviewPageRequest:
      type: object
      additionalProperties: false
      required: [pageId, viewport]
      properties:
        pageId: { type: string, format: uuid }
        viewport: { $ref: '#/components/schemas/ReviewViewport' }
        stateLabel: { type: string, maxLength: 100 }
    CreateReviewFindingRequest:
      type: object
      additionalProperties: false
      required: [category, severity, summary, evidenceCaptureId]
      properties:
        pageId: { type: [string, 'null'], format: uuid }
        category: { type: string, enum: [requirement, design, backend, accessibility, performance, seo, security] }
        severity: { type: string, enum: [critical, high, medium, low, info] }
        summary: { type: string, minLength: 1, maxLength: 500 }
        evidenceCaptureId: { type: string, format: uuid }
        coordinate:
          type: [object, 'null']
          additionalProperties: false
          required: [x, y]
          properties:
            x: { type: number, minimum: 0, maximum: 1 }
            y: { type: number, minimum: 0, maximum: 1 }
    UpdateReviewFindingRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [open, accepted, dismissed, fixed, unknown] }
    CreateReviewRequirementRequest:
      type: object
      additionalProperties: false
      required: [pageId, title]
      properties:
        pageId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 500 }
        category: { type: string, enum: [requirement, design, backend, accessibility, performance, seo, security], default: requirement }
        details: { type: [string, 'null'], maxLength: 4000 }
    UpdateReviewRequirementRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [pending, satisfied, failed, blocked, unknown] }
        verificationNote: { type: [string, 'null'], maxLength: 2000 }
        evidenceCaptureId: { type: [string, 'null'], format: uuid }
    ReviewRequirementResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id, pageId, category, title, details, status, verificationNote, evidenceCaptureId, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            pageId: { type: [string, 'null'], format: uuid }
            category: { type: string, enum: [requirement, design, backend, accessibility, performance, seo, security] }
            title: { type: string, maxLength: 500 }
            details: { type: [string, 'null'] }
            status: { type: string, enum: [pending, satisfied, failed, blocked, unknown] }
            verificationNote: { type: [string, 'null'], maxLength: 2000 }
            evidenceCaptureId: { type: [string, 'null'], format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ReviewRequirementListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ReviewRequirementResponse/properties/data'
    ReviewFindingResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id, pageId, category, severity, status, confidence, summary, coordinates, evidence, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            pageId: { type: [string, 'null'], format: uuid }
            category: { type: string, enum: [requirement, design, backend, accessibility, performance, seo, security] }
            severity: { type: string, enum: [critical, high, medium, low, info] }
            status: { type: string, enum: [open, accepted, dismissed, fixed, unknown] }
            confidence: { type: string, enum: [high, medium, low] }
            summary: { type: string, maxLength: 500 }
            coordinates:
              type: [object, 'null']
              additionalProperties: false
              required: [x, y]
              properties:
                x: { type: number, minimum: 0, maximum: 1 }
                y: { type: number, minimum: 0, maximum: 1 }
            evidence:
              type: object
              additionalProperties: false
              required: [captureId]
              properties:
                captureId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ReviewFindingListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ReviewFindingResponse/properties/data'
    ReviewExportRequest:
      type: object
      additionalProperties: false
      required: [format]
      properties:
        format: { type: string, enum: [pdf, html, json] }
    FigmaConnectionStatusResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [connected, figmaUserId, expiresAt, connectedAt]
          properties:
            connected: { type: boolean }
            figmaUserId: { type: [string, 'null'], maxLength: 128 }
            expiresAt: { type: [string, 'null'], format: date-time }
            connectedAt: { type: [string, 'null'], format: date-time }
    FigmaAuthorizationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [authorizationUrl]
          properties:
            authorizationUrl: { type: string, format: uri }
    FigmaCallbackRequest:
      type: object
      additionalProperties: false
      required: [code, state]
      properties:
        code: { type: string, minLength: 1, maxLength: 4096 }
        state: { type: string, minLength: 32, maxLength: 128 }
