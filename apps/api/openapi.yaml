  /projects/{projectId}/ai-history:
    get:
      tags: [Journey]
      operationId: getAiHistory
      summary: History of AI requests in the project
      description: |
        Every AI request and template draft with who asked, stage and block, source (app or Telegram), model, provider-reported tokens,
        resulting version and what happened to it (accepted, current draft, replaced, failed). Owners and managers see the whole project;
        a specialist sees only the stages they are assigned to and other people as roles. Summaries by participant and by stage cover the
        same filter without paging and text search.
      x-implementation-status: implemented
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: stageKey, in: query, schema: { type: string } }
        - { name: authorId, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, description: Text search in the request, schema: { type: string, maxLength: 200 } }
        - { name: before, in: query, description: Cursor from nextBefore, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [items, nextBefore, summary, filters]
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            createdAt: { type: string, format: date-time }
                            stage: { type: object, properties: { key: { type: string }, title: { type: string } } }
                            author: { $ref: '#/components/schemas/HistoryPerson' }
                            text: { type: [string, 'null'], description: The request text; null for a draft without instructions }
                            savedAs: { type: [string, 'null'], enum: [one_off, stage_rule, project_rule, null] }
                            targetKey: { type: [string, 'null'] }
                            rulesApplied: { type: integer }
                            kind: { type: string, enum: [ai, template] }
                            model: { type: [string, 'null'] }
                            source: { type: string, enum: [app, telegram] }
                            tokens: { type: [object, 'null'], properties: { input: { type: [integer, 'null'] }, output: { type: [integer, 'null'] } } }
                            cost: { type: [number, 'null'], description: Cost for the customer in tenge at the prices of the moment }
                            durationMs: { type: integer }
                            result: { type: [object, 'null'], properties: { versionNumber: { type: integer } } }
                            outcome: { type: string, enum: [accepted, current, replaced, failed] }
                            errorCode: { type: [string, 'null'] }
                      nextBefore: { type: [string, 'null'], format: date-time }
                      summary:
                        type: object
                        properties:
                          byAuthor: { type: array, items: { type: object, properties: { author: { $ref: '#/components/schemas/HistoryPerson' }, requests: { type: integer }, failed: { type: integer }, tokens: { type: integer } } } }
                          byStage: { type: array, items: { type: object, properties: { stage: { type: object }, requests: { type: integer }, failed: { type: integer }, tokens: { type: integer } } } }
                          tokensReported: { type: boolean }
                      filters:
                        type: object
                        properties:
                          stages: { type: array, items: { type: object, properties: { key: { type: string }, title: { type: string } } } }
                          authors: { type: array, items: { $ref: '#/components/schemas/HistoryPerson' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/stages/{stageKey}/changes:
    get:
      tags: [Journey]
      operationId: getStageChanges
      summary: Change notices of a stage
      description: |
        A new accepted version of a stage creates a notice for every stage built directly on it that already has work, with a plain-language
        list of changes. While a notice is open the target stage keeps using the source version it was built on and cannot be accepted or
        submitted (409 CHANGE_NOTICE_OPEN); an accepted target becomes stale. Reopening a stage alone changes nothing for its dependents.
      x-implementation-status: implemented
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: stageKey, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'items: id, status (open, discussing, accepted, accepted_no_change), direction (incoming, outgoing), source (key, title, fromVersion, toVersion), target, changes, createdBy, decidedBy, decidedByOwner, messages (side target/source/owner, resolution, text, author), can (decide, discuss, reply)' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/changes/{noticeId}:
    post:
      tags: [Journey]
      operationId: actOnChange
      summary: Decide on or discuss a change notice
      description: |
        Target side (active lead specialist of the target stage, or owner/manager): accept (a stale target goes back to work), accept_no_change
        (a stale target is accepted again), discuss (text required). Source side (lead of the changed stage, or owner/manager): reply with text
        and resolution kept, will_revise or escalate. A new accepted source version supersedes the notice and keeps the original pin;
        returning to the pinned version closes it. Participants are notified in Telegram.
      x-implementation-status: implemented
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: noticeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string, enum: [accept, accept_no_change, discuss, reply] }
                text: { type: [string, 'null'], maxLength: 2000 }
                resolution: { type: [string, 'null'], enum: [kept, will_revise, escalate, null] }
      responses:
        '200': { description: Change notices of the target stage after the action }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem', description: CHANGE_NOTICE_CLOSED, CHANGE_NOT_DISCUSSED, PROJECT_NOT_ACTIVE }
