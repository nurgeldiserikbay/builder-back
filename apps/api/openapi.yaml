        '200': { description: 'repository, branch, files (path, bytes), siteIncluded, complete' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Choices]
      operationId: pushRepository
      summary: Send accepted results to the repository as one commit
      description: Requires confirm=true every time (owners and managers). Recorded as repository_pushed with the commit address.
