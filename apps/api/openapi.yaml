        '422': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/deployment/verify:
    post:
      tags: [Choices]
      operationId: verifyDeployment
      summary: Check that the chosen deployment serves the latest accepted site
      description: For BuildPath — the publication is live and current. Otherwise BuildPath opens the address (public addresses only, every redirect re-checked, 3 MB limit) and compares the page with the accepted site — matches, outdated, different, unreachable, not_allowed. A match marks the verify step done. Owners and managers.
