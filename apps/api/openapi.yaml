            nextCursor: { type: [string, 'null'] }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        requestId: { type: string, minLength: 1, maxLength: 128 }
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
    StageStatus:
      type: string
      enum: [locked, ready, awaiting_lead, in_progress, in_review, changes_requested, approved, stale, imported, skipped, blocked]
    BriefArtifact:
      type: object
