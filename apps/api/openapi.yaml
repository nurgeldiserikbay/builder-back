openapi: 3.1.0
info:
  title: BuildPath API
  version: 1.1.0
  description: |
    Contract-first API for BuildPath. This document is the source of truth for
    request and response shapes. An operation marked planned is not implemented
    until its behavior is verified in the API.
servers:
  - url: http://localhost:4000/api/v1
tags:
  - name: Health
  - name: Authentication
  - name: Workspaces
  - name: Projects
  - name: Reviews
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check API process health
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: API process is accepting requests; this does not assert database/provider readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check whether the API can access required database state
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: API process and PostgreSQL are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseReadinessResponse'
        '503':
          description: PostgreSQL is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Create an account and begin email verification
      description: Requires configured Resend email delivery. Does not create a session until email is verified.
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Verification message accepted; response does not reveal whether an email already has an account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAccepted'
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /auth/verify-email:
    post:
      tags: [Authentication]
      operationId: verifyEmail
      summary: Verify an account email address
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204': { description: Email verified }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Sign in to a verified account
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session established using a secure HTTP-only cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Secure, HTTP-only, SameSite cookie; never expose session tokens in JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current session
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Problem' }
  /me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get the signed-in account
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: List workspaces available to the current account
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Active workspace memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceListResponse'
        '401': { $ref: '#/components/responses/Problem' }
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects available to the current account
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 512 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Bounded project page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a private project in a workspace
      description: Requires active workspace owner, admin, or operator membership. Creator becomes project owner.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}:
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project the current account may access
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/reviews:
    post:
      tags: [Reviews]
      operationId: createReview
      summary: Create a read-only site review
      description: Creates a review in the current project. Replaying the same idempotency key and request returns the original review for 30 days.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /reviews/{reviewId}:
    get:
      tags: [Reviews]
      operationId: getReview
      summary: Get review progress and configuration
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: Review state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /reviews/{reviewId}/sources/url:
    post:
      tags: [Reviews]
      operationId: registerReviewUrl
      summary: Add a website URL for analysis
      description: Validates the initial target against the SSRF policy and persists a discovery job for a separate worker. The API does not fetch the site itself. Redirects must be revalidated by the worker.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterReviewUrlRequest'
      responses:
        '202':
          description: Target validated and a discovery job persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewSourceAccepted'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /integrations/figma/status:
    get:
      tags: [Reviews]
      operationId: getFigmaConnectionStatus
      summary: Get the current user's Figma connection status
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Figma connection status without exposing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigmaConnectionStatusResponse'
        '401': { $ref: '#/components/responses/Problem' }
  /integrations/figma/connect:
    post:
      tags: [Reviews]
      operationId: startFigmaConnection
      summary: Start a PKCE-protected Figma OAuth flow
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '201':
          description: Short-lived authorization URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigmaAuthorizationResponse'
        '401': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /integrations/figma/callback:
    post:
      tags: [Reviews]
      operationId: completeFigmaConnection
      summary: Exchange a Figma authorization code and store encrypted credentials
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FigmaCallbackRequest'
      responses:
        '201':
          description: Figma account connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigmaConnectedResponse'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /integrations/figma/connection:
    delete:
      tags: [Reviews]
      operationId: disconnectFigma
      summary: Remove the current user's Figma connection
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Figma connection removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigmaConnectedResponse'
        '401': { $ref: '#/components/responses/Problem' }
  /reviews/{reviewId}/sources/figma-import:
    post:
      tags: [Reviews]
      operationId: importFigmaFrame
      summary: Export a Figma frame into private verified design storage
      description: The frame is fetched through the user's Figma OAuth connection, stored privately, scanned, and mapped to the selected review page.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FigmaFrameImportRequest'
      responses:
        '201':
          description: Verified Figma frame mapped to the page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigmaFrameImportResponse'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /reviews/{reviewId}/sources/design-upload:
    post:
      tags: [Reviews]
      operationId: requestDesignUpload
      summary: Request a private signed upload for a page design
      description: Returns a short-lived upload target after validating file metadata. The client uploads bytes directly to private object storage, then calls the completion operation.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesignUploadRequest'
      responses:
        '201':
          description: Private upload reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignUploadResponse'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /reviews/{reviewId}/sources/design-upload/{assetId}/complete:
    post:
      tags: [Reviews]
      operationId: completeDesignUpload
      summary: Verify an uploaded design asset
      description: Checks file signature, checksum, malware scan state, and project access before the asset can be mapped to a page.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - in: path
          name: assetId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Verified design asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignAssetResponse'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /reviews/{reviewId}/sources/design-upload/{assetId}/url:
    get:
      tags: [Reviews]
      operationId: getDesignAssetUrl
      summary: Get a short-lived URL for a verified design image
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - in: path
          name: assetId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Authorized temporary image URL
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [url, expiresInSeconds]
                    properties:
                      url: { type: string, format: uri }
                      expiresInSeconds: { type: integer, enum: [300] }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /reviews/{reviewId}/pages/discover:
    post:
      tags: [Reviews]
      operationId: discoverReviewPages
      summary: Queue bounded same-origin page discovery
      description: Discovery uses only the validated review origin, follows bounded redirects and page/depth limits, and runs in an isolated worker with restricted egress.
      x-implementation-status: planned
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverPagesRequest'
      responses:
        '202':
          description: Discovery job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewJobAccepted'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /reviews/{reviewId}/pages:
    get:
      tags: [Reviews]
      operationId: listReviewPages
      summary: List discovered or manually added pages
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: Review pages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPageListResponse'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /reviews/{reviewId}/page-mappings/{pageId}:
    put:
      tags: [Reviews]
      operationId: mapReviewPage
      summary: Map a website page to a design and project evidence
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - in: path
          name: pageId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageMappingRequest'
      responses:
        '200':
          description: Saved page mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPageResponse'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /reviews/{reviewId}/captures:
    post:
      tags: [Reviews]
      operationId: captureReviewPage
      summary: Queue an immutable page capture
      description: Captures a mapped route at the requested viewport using an isolated browser worker. Captures are read-only and tied to a source snapshot.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureReviewPageRequest'
      responses:
        '202':
          description: Capture job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureJobAccepted'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /reviews/{reviewId}/captures/{captureId}:
    get:
      tags: [Reviews]
      operationId: getReviewCapture
      summary: Get capture status, screenshot, and pixel-difference preview
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - in: path
          name: captureId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Capture state and authorized preview URL
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [captureId, status, screenshotUrl, sha256, visualDiff, aiAnalysis, viewport, safeErrorCode, capturedAt]
                    properties:
                      captureId: { type: string, format: uuid }
                      status: { type: string, enum: [queued, captured, failed] }
                      screenshotUrl: { type: [string, 'null'], format: uri }
                      sha256: { type: [string, 'null'], pattern: "^[a-f0-9]{64}$" }
                      viewport: { $ref: '#/components/schemas/ReviewViewport' }
                      safeErrorCode: { type: [string, 'null'], maxLength: 64 }
                      capturedAt: { type: [string, 'null'], format: date-time }
                      aiAnalysis:
                        oneOf:
                          - type: 'null'
                          - $ref: '#/components/schemas/AiDesignAnalysis'
                      visualDiff:
                        oneOf:
                          - type: 'null'
                          - type: object
                            additionalProperties: false
                            required: [status, diffOverlayUrl]
                            properties:
                              status: { type: string, enum: [ready, failed] }
                              diffOverlayUrl: { type: [string, 'null'], format: uri }
                              changedPercent: { type: number, minimum: 0, maximum: 100 }
                              changedPixels: { type: integer, minimum: 0 }
                              totalPixels: { type: integer, minimum: 1 }
                              width: { type: integer, minimum: 1 }
                              height: { type: integer, minimum: 1 }
                              threshold: { type: integer, minimum: 0, maximum: 255 }
                              safeErrorCode: { type: string, maxLength: 64 }
                              regions:
                                type: array
                                maxItems: 50
                                items:
                                  type: object
                                  additionalProperties: false
                                  required: [x, y, width, height, changedPercent]
                                  properties:
                                    x: { type: number, minimum: 0, maximum: 1 }
                                    y: { type: number, minimum: 0, maximum: 1 }
                                    width: { type: number, minimum: 0, maximum: 1 }
                                    height: { type: number, minimum: 0, maximum: 1 }
                                    changedPercent: { type: number, minimum: 0, maximum: 100 }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /reviews/{reviewId}/captures/{captureId}/ai-analysis:
    post:
      tags: [Reviews]
      operationId: analyzeReviewCaptureWithAi
      summary: Analyze a captured page against its mapped design
      description: Explicitly sends the private capture and mapped design to the configured OpenAI vision model. Results are stored per immutable capture and remain suggestions for human review.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - in: path
          name: captureId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: AI design analysis and human-review suggestions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [analysis, reused]
                    properties:
                      reused: { type: boolean }
                      analysis: { $ref: '#/components/schemas/AiDesignAnalysis' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /reviews/{reviewId}/requirements:
    post:
      tags: [Reviews]
      operationId: createReviewRequirement
      summary: Add a requirement to a page checklist
      description: Requirements are manually entered and remain unverified until a reviewer attaches captured evidence and marks them satisfied.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequirementRequest'
      responses:
        '201':
          description: Requirement created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewRequirementResponse'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /reviews/{reviewId}/pages/{pageId}/requirements:
    get:
      tags: [Reviews]
      operationId: listPageRequirements
      summary: List page requirements and evidence status
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - in: path
          name: pageId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Page requirements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewRequirementListResponse'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /reviews/{reviewId}/requirements/{requirementId}:
    patch:
      tags: [Reviews]
      operationId: updateReviewRequirement
      summary: Set requirement status and captured evidence
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - in: path
          name: requirementId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReviewRequirementRequest'
      responses:
        '200':
          description: Requirement and evidence status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewRequirementResponse'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /reviews/{reviewId}/pages/{pageId}/findings:
    get:
      tags: [Reviews]
      operationId: listReviewPageFindings
      summary: List manual findings for a page
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - in: path
          name: pageId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Page findings with captured evidence references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewFindingListResponse'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /reviews/{reviewId}/findings:
    post:
      tags: [Reviews]
      operationId: createReviewFinding
      summary: Add a manual finding or annotation
      description: Coordinates are relative to the immutable capture identified in the request; findings remain scoped to the current project.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewFindingRequest'
      responses:
        '201':
          description: Finding created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewFindingResponse'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /reviews/{reviewId}/findings/{findingId}:
    patch:
      tags: [Reviews]
      operationId: updateReviewFinding
      summary: Update finding status, assignment, or comment
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - in: path
          name: findingId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReviewFindingRequest'
      responses:
        '200':
          description: Updated finding with audit metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewFindingResponse'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /reviews/{reviewId}/exports:
    post:
      tags: [Reviews]
      operationId: exportReviewReport
      summary: Queue an authorized report export
      description: Export includes only data the current user can access and uses a short-lived download URL once ready.
      x-implementation-status: planned
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewExportRequest'
      responses:
        '202':
          description: Export job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewJobAccepted'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /reviews/{reviewId}/pages/{pageId}/api-checks:
    get:
      tags: [Reviews]
      operationId: listPageApiChecks
      summary: List recent sanitized API check metadata for a review page
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - $ref: '#/components/parameters/PageId'
      responses:
        '200':
          description: Up to 50 recent checks; secrets, query parameters, and response bodies are excluded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewApiCheckListResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Reviews]
      operationId: savePageApiCheck
      summary: Save sanitized metadata from a browser-run API check
      description: Tokens, headers, query parameters, expected values, and response bodies are never accepted.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - $ref: '#/components/parameters/PageId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveReviewApiCheckRequest' }
      responses:
        '201':
          description: Sanitized metadata saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewApiCheckResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /reviews/{reviewId}/report:
    get:
      tags: [Reviews]
      operationId: getReviewReport
      summary: Get the latest versioned evidence report
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: Current review summary with pages, checklist statuses, and findings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewReportResponse'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: buildpath_session
  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: { type: string, format: uuid }
    ReviewId:
      in: path
      name: reviewId
      required: true
      schema: { type: string, format: uuid }
    PageId:
      in: path
      name: pageId
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Replaying the same key and body returns the original result; reusing it with a different body returns 409.
      schema: { type: string, minLength: 16, maxLength: 128 }
  responses:
    Problem:
      description: RFC 9457 problem response with stable application code and request ID.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CreateReviewRequest:
      type: object
      additionalProperties: false
      required: [title, mode, locale]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        mode: { type: string, enum: [site_only, site_and_design, design_only] }
        locale: { type: string, enum: [en, ru, kk] }
    Review:
      type: object
      additionalProperties: false
      required: [id, projectId, title, mode, status, locale, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        title: { type: string }
        mode: { type: string, enum: [site_only, site_and_design, design_only] }
        status: { type: string, enum: [draft, queued, discovering, ready, failed, cancelled] }
        locale: { type: string, enum: [en, ru, kk] }
        sourceSnapshotId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReviewResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Review' }
    RegisterReviewUrlRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
    ReviewSourceAccepted:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [jobId, status]
          properties:
            jobId: { type: string, format: uuid }
            status: { type: string, enum: [queued, running] }
    DesignUploadRequest:
      type: object
      additionalProperties: false
      required: [fileName, contentType, sizeBytes, sha256]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        contentType: { type: string, enum: [image/png, image/jpeg] }
        sizeBytes: { type: integer, minimum: 1, maximum: 20971520 }
        sha256: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
    DesignUploadResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [assetId, uploadUrl, method, expiresAt, requiredFields]
          properties:
            assetId: { type: string, format: uuid }
            uploadUrl: { type: string, format: uri }
            method: { type: string, enum: [POST] }
            expiresAt: { type: string, format: date-time }
            requiredFields:
              type: object
              additionalProperties: { type: string }
    DesignAssetResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [assetId, status]
          properties:
            assetId: { type: string, format: uuid }
            status: { type: string, enum: [verified] }
    DiscoverPagesRequest:
      type: object
      additionalProperties: false
      required: [maxPages, maxDepth]
      properties:
        maxPages: { type: integer, minimum: 1, maximum: 100, default: 30 }
        maxDepth: { type: integer, minimum: 0, maximum: 5, default: 3 }
        includeSitemap: { type: boolean, default: true }
    ReviewJobAccepted:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [jobId, status]
          properties:
            jobId: { type: string, format: uuid }
            status: { type: string, enum: [queued, running] }

    CaptureJobAccepted:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [jobId, captureId, status]
          properties:
            jobId: { type: string, format: uuid }
            captureId: { type: string, format: uuid }
            status: { type: string, enum: [queued, running, succeeded, failed] }
    PageMappingRequest:
      type: object
      additionalProperties: false
      required: [viewport, requirementIds]
      properties:
        designAssetId: { type: [string, 'null'], format: uuid }
        figmaFileKey: { type: [string, 'null'], maxLength: 128, description: Reserved for an explicitly authorized read-only Figma integration. }
        figmaNodeId: { type: [string, 'null'], maxLength: 128 }
        viewport:
          $ref: '#/components/schemas/ReviewViewport'
        requirementIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    AiDesignAnalysis:
      type: object
      additionalProperties: false
      required: [status, provider, model, createdAt, summary, findings, limitation]
      properties:
        status: { type: string, enum: [complete] }
        provider: { type: string, enum: [openai] }
        model: { type: string, maxLength: 80 }
        createdAt: { type: string, format: date-time }
        summary: { type: string, maxLength: 1200 }
        limitation: { type: string, maxLength: 500 }
        findings:
          type: array
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            required: [category, severity, confidence, summary, details, evidence]
            properties:
              category: { type: string, enum: [design] }
              severity: { type: string, enum: [critical, high, medium, low, info] }
              confidence: { type: string, enum: [low, medium, high] }
              summary: { type: string, maxLength: 300 }
              details: { type: string, maxLength: 1200 }
              evidence: { type: string, maxLength: 500 }
    ReviewViewport:
      type: object
      additionalProperties: false
      required: [width, height, deviceScale]
      properties:
        width: { type: integer, minimum: 320, maximum: 3840 }
        height: { type: integer, minimum: 568, maximum: 4320 }
        deviceScale: { type: number, minimum: 1, maximum: 3 }
    ReviewPage:
      type: object
      additionalProperties: false
      required: [id, route, label, status, designAssetId, viewport, findingCount]
      properties:
        id: { type: string, format: uuid }
        route: { type: string, maxLength: 2048 }
        label: { type: string, maxLength: 120 }
        status: { type: string, enum: [discovered, mapped, captured, needs_review, failed] }
        designAssetId: { type: [string, 'null'], format: uuid }
        viewport: { $ref: '#/components/schemas/ReviewViewport' }
        findingCount: { type: integer, minimum: 0 }
    ReviewPageResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ReviewPage' }
    ReviewPageListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ReviewPage' }
    CaptureReviewPageRequest:
      type: object
      additionalProperties: false
      required: [pageId, viewport]
      properties:
        pageId: { type: string, format: uuid }
        viewport: { $ref: '#/components/schemas/ReviewViewport' }
        stateLabel: { type: string, maxLength: 100 }
    CreateReviewFindingRequest:
      type: object
      additionalProperties: false
      required: [category, severity, summary, evidenceCaptureId]
      properties:
        pageId: { type: [string, 'null'], format: uuid }
        category: { type: string, enum: [requirement, design, backend, accessibility, performance, seo, security] }
        severity: { type: string, enum: [critical, high, medium, low, info] }
        summary: { type: string, minLength: 1, maxLength: 500 }
        evidenceCaptureId: { type: string, format: uuid }
        coordinate:
          type: [object, 'null']
          additionalProperties: false
          required: [x, y]
          properties:
            x: { type: number, minimum: 0, maximum: 1 }
            y: { type: number, minimum: 0, maximum: 1 }
    UpdateReviewFindingRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [open, accepted, dismissed, fixed, unknown] }
    CreateReviewRequirementRequest:
      type: object
      additionalProperties: false
      required: [pageId, title]
      properties:
        pageId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 500 }
        category: { type: string, enum: [requirement, design, backend, accessibility, performance, seo, security], default: requirement }
        details: { type: [string, 'null'], maxLength: 4000 }
    UpdateReviewRequirementRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [pending, satisfied, failed, blocked, unknown] }
        verificationNote: { type: [string, 'null'], maxLength: 2000 }
        evidenceCaptureId: { type: [string, 'null'], format: uuid }
    ReviewRequirementResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id, pageId, category, title, details, status, verificationNote, evidenceCaptureId, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            pageId: { type: [string, 'null'], format: uuid }
            category: { type: string, enum: [requirement, design, backend, accessibility, performance, seo, security] }
            title: { type: string, maxLength: 500 }
            details: { type: [string, 'null'] }
            status: { type: string, enum: [pending, satisfied, failed, blocked, unknown] }
            verificationNote: { type: [string, 'null'], maxLength: 2000 }
            evidenceCaptureId: { type: [string, 'null'], format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ReviewRequirementListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ReviewRequirementResponse/properties/data'
    ReviewFindingResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id, pageId, category, severity, status, confidence, summary, coordinates, evidence, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            pageId: { type: [string, 'null'], format: uuid }
            category: { type: string, enum: [requirement, design, backend, accessibility, performance, seo, security] }
            severity: { type: string, enum: [critical, high, medium, low, info] }
            status: { type: string, enum: [open, accepted, dismissed, fixed, unknown] }
            confidence: { type: string, enum: [high, medium, low] }
            summary: { type: string, maxLength: 500 }
            coordinates:
              type: [object, 'null']
              additionalProperties: false
              required: [x, y]
              properties:
                x: { type: number, minimum: 0, maximum: 1 }
                y: { type: number, minimum: 0, maximum: 1 }
            evidence:
              type: object
              additionalProperties: false
              required: [captureId]
              properties:
                captureId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ReviewFindingListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ReviewFindingResponse/properties/data'
    ReviewExportRequest:
      type: object
      additionalProperties: false
      required: [format]
      properties:
        format: { type: string, enum: [pdf, html, json] }
    FigmaConnectionStatusResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [connected, figmaUserId, expiresAt, connectedAt]
          properties:
            connected: { type: boolean }
            figmaUserId: { type: [string, 'null'], maxLength: 128 }
            expiresAt: { type: [string, 'null'], format: date-time }
            connectedAt: { type: [string, 'null'], format: date-time }
    FigmaAuthorizationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [authorizationUrl]
          properties:
            authorizationUrl: { type: string, format: uri }
    FigmaCallbackRequest:
      type: object
      additionalProperties: false
      required: [code, state]
      properties:
        code: { type: string, minLength: 1, maxLength: 4096 }
        state: { type: string, minLength: 32, maxLength: 128 }
    FigmaConnectedResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [connected]
          properties:
            connected: { type: boolean }
    FigmaFrameImportRequest:
      type: object
      additionalProperties: false
      required: [pageId, figmaUrl, viewport]
      properties:
        pageId: { type: string, format: uuid }
        figmaUrl: { type: string, format: uri, maxLength: 2048 }
        viewport:
          type: object
          additionalProperties: false
          required: [width, height, deviceScale]
          properties:
            width: { type: integer, minimum: 320, maximum: 3840 }
            height: { type: integer, minimum: 568, maximum: 4320 }
            deviceScale: { type: number, minimum: 1, maximum: 3 }
    FigmaFrameImportResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [assetId, status, fileKey, nodeId]
          properties:
            assetId: { type: string, format: uuid }
            status: { const: verified }
            fileKey: { type: string, maxLength: 128 }
            nodeId: { type: string, pattern: '^[0-9]+:[0-9]+$' }
    SaveReviewApiCheckRequest:
      type: object
      additionalProperties: false
      required: [method, endpoint, expectedStatus, actualStatus, durationMs, jsonPath, jsonMatches, safeErrorCode, checkedAt, requirementId]
      properties:
        method: { type: string, enum: [GET, HEAD] }
        endpoint: { type: string, format: uri, maxLength: 2048, description: HTTPS URL without query or fragment; HTTP only for localhost }
        expectedStatus: { type: integer, minimum: 100, maximum: 599 }
        actualStatus: { type: [integer, 'null'], minimum: 100, maximum: 599 }
        durationMs: { type: integer, minimum: 0, maximum: 12000 }
        jsonPath: { type: [string, 'null'], maxLength: 160 }
        jsonMatches: { type: [boolean, 'null'] }
        safeErrorCode: { type: [string, 'null'], enum: [REQUEST_FAILED, REQUEST_TIMEOUT, null] }
        checkedAt: { type: string, format: date-time }
        requirementId: { type: [string, 'null'], format: uuid, description: Optional backend-category requirement on this page }
    ReviewApiCheck:
      type: object
      additionalProperties: false
      required: [id, requirementId, method, endpoint, expectedStatus, actualStatus, durationMs, passed, jsonPath, jsonMatches, safeErrorCode, checkedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        requirementId: { type: [string, 'null'], format: uuid }
        method: { type: string, enum: [GET, HEAD] }
        endpoint: { type: string, maxLength: 2048 }
        expectedStatus: { type: integer, minimum: 100, maximum: 599 }
        actualStatus: { type: [integer, 'null'], minimum: 100, maximum: 599 }
        durationMs: { type: integer, minimum: 0, maximum: 12000 }
        passed: { type: boolean }
        jsonPath: { type: [string, 'null'], maxLength: 160 }
        jsonMatches: { type: [boolean, 'null'] }
        safeErrorCode: { type: [string, 'null'], enum: [REQUEST_FAILED, REQUEST_TIMEOUT, null] }
        checkedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ReviewApiCheckResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ReviewApiCheck' }
    ReviewApiCheckListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ReviewApiCheck' }
    ReviewReportResponse:
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [schemaVersion, generatedAt, review, summary, pages, signals, limitations]
          properties:
            schemaVersion: { const: 3 }
            generatedAt: { type: string, format: date-time }
            review:
              type: object
              additionalProperties: false
              required: [id, projectId, title, mode, status, locale, siteOrigin, createdAt, updatedAt]
              properties:
                id: { type: string, format: uuid }
                projectId: { type: string, format: uuid }
                title: { type: string, maxLength: 120 }
                mode: { type: string, enum: [site_only, site_and_design, design_only] }
                status: { type: string, enum: [draft, queued, discovering, ready, failed, cancelled] }
                locale: { type: string, enum: [en, ru, kk] }
                siteOrigin: { type: [string, 'null'], maxLength: 512 }
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
            summary:
              type: object
              additionalProperties: false
              required: [pages, visualDiff, requirements, findings, apiChecks, aiReview, analysis]
              properties:
                pages:
                  type: object
                  additionalProperties: false
                  required: [total, mapped, captured]
                  properties:
                    total: { type: integer, minimum: 0 }
                    mapped: { type: integer, minimum: 0 }
                    captured: { type: integer, minimum: 0 }
                requirements:
                  type: object
                  additionalProperties: false
                  required: [total, byStatus]
                  properties:
                    total: { type: integer, minimum: 0 }
                    byStatus: { type: object, additionalProperties: { type: integer, minimum: 0 } }
                visualDiff:
                  type: object
                  additionalProperties: false
                  required: [compared, averageChangedPercent]
                  properties:
                    compared: { type: integer, minimum: 0 }
                    averageChangedPercent: { type: [number, 'null'], minimum: 0, maximum: 100 }
                findings:
                  type: object
                  additionalProperties: false
                  required: [total, byStatus]
                  properties:
                    total: { type: integer, minimum: 0 }
                    byStatus: { type: object, additionalProperties: { type: integer, minimum: 0 } }
                apiChecks:
                  type: object
                  additionalProperties: false
                  required: [totalRecent, passedRecent]
                  properties:
                    totalRecent: { type: integer, minimum: 0 }
                    passedRecent: { type: integer, minimum: 0 }
                aiReview:
                  type: object
                  additionalProperties: false
                  required: [analyzedCaptures, totalSuggestions, byConfidence]
                  properties:
                    analyzedCaptures: { type: integer, minimum: 0, maximum: 100 }
                    totalSuggestions: { type: integer, minimum: 0, maximum: 1200 }
                    byConfidence:
                      type: object
                      additionalProperties: false
                      properties:
                        high: { type: integer, minimum: 0 }
                        medium: { type: integer, minimum: 0 }
                        low: { type: integer, minimum: 0 }
                analysis:
                  type: object
                  additionalProperties: false
                  required: [source, totalSignals, bySeverity]
                  properties:
                    source: { const: rules_v1 }
                    totalSignals: { type: integer, minimum: 0, maximum: 500 }
                    bySeverity:
                      type: object
                      additionalProperties: false
                      properties:
                        high: { type: integer, minimum: 0 }
                        medium: { type: integer, minimum: 0 }
                        info: { type: integer, minimum: 0 }
            pages:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, route, title, status, designMapped, latestCapture, requirements, findings, apiChecks]
                properties:
                  id: { type: string, format: uuid }
                  route: { type: string, maxLength: 2048 }
                  title: { type: [string, 'null'], maxLength: 200 }
                  status: { type: string }
                  designMapped: { type: boolean }
                  latestCapture:
                    oneOf:
                      - type: 'null'
                      - type: object
                        additionalProperties: false
                        required: [status, capturedAt, visualDiff, qualityAudit, aiAnalysis]
                        properties:
                          status: { type: string, enum: [queued, captured, failed] }
                          capturedAt: { type: [string, 'null'], format: date-time }
                          visualDiff:
                            oneOf:
                              - type: 'null'
                              - type: object
                                additionalProperties: false
                                required: [status, changedPercent]
                                properties:
                                  status: { type: string, enum: [ready, failed] }
                                  changedPercent: { type: [number, 'null'], minimum: 0, maximum: 100 }
                          aiAnalysis:
                            oneOf:
                              - type: 'null'
                              - $ref: '#/components/schemas/AiDesignAnalysis'
                          qualityAudit:
                            oneOf:
                              - type: 'null'
                              - type: object
                                additionalProperties: false
                                required: [checkedAt, pageTitlePresent, languagePresent, h1Count, imagesMissingAlt, linksMissingName, buttonsMissingName, formControlsMissingLabel]
                                properties:
                                  checkedAt: { type: [string, 'null'], format: date-time }
                                  pageTitlePresent: { type: boolean }
                                  languagePresent: { type: boolean }
                                  h1Count: { type: integer, minimum: 0 }
                                  imagesMissingAlt: { type: integer, minimum: 0 }
                                  linksMissingName: { type: integer, minimum: 0 }
                                  buttonsMissingName: { type: integer, minimum: 0 }
                                  formControlsMissingLabel: { type: integer, minimum: 0 }
                  requirements:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, category, title, status, verificationNote, evidenceCaptureId]
                      properties:
                        id: { type: string, format: uuid }
                        category: { type: string, enum: [requirement, design, backend, accessibility, performance, seo, security] }
                        title: { type: string, maxLength: 500 }
                        status: { type: string, enum: [pending, satisfied, failed, blocked, unknown] }
                        verificationNote: { type: [string, 'null'], maxLength: 2000 }
                        evidenceCaptureId: { type: [string, 'null'], format: uuid }
                  apiChecks:
                    type: array
                    maxItems: 50
                    items: { $ref: '#/components/schemas/ReviewApiCheck' }
                  findings:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, category, severity, status, summary, createdAt]
                      properties:
                        id: { type: string, format: uuid }
                        category: { type: string, enum: [requirement, design, backend, accessibility, performance, seo, security] }
                        severity: { type: string, enum: [critical, high, medium, low, info] }
                        status: { type: string, enum: [open, accepted, dismissed, fixed, unknown] }
                        summary: { type: string, maxLength: 500 }
                        createdAt: { type: string, format: date-time }
            signals:
              type: array
              maxItems: 500
              items:
                type: object
                additionalProperties: false
                required: [id, code, severity, pageId, requirementId, title, details]
                properties:
                  id: { type: string, maxLength: 120 }
                  code: { type: string, enum: [DESIGN_NOT_MAPPED, SITE_NOT_CAPTURED, CAPTURE_FAILED, LARGE_VISUAL_DIFFERENCE, REQUIREMENT_FAILED, REQUIREMENT_UNVERIFIED, REQUIREMENT_BLOCKED, PAGE_TITLE_MISSING, PAGE_LANGUAGE_MISSING, PRIMARY_HEADING_MISSING, IMAGES_MISSING_ALT, LINKS_MISSING_NAME, BUTTONS_MISSING_NAME, FORM_LABELS_MISSING, BACKEND_REQUIREMENT_UNTESTED, API_CHECK_FAILED, HIGH_SEVERITY_FINDING] }
                  severity: { type: string, enum: [high, medium, info] }
                  pageId: { type: string, format: uuid }
                  requirementId: { type: [string, 'null'], format: uuid }
                  title: { type: string, maxLength: 200 }
                  details: { type: string, maxLength: 500 }
            limitations:
              type: array
              items: { type: string, maxLength: 500 }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status, timestamp]
          properties:
            status: { const: ok }
            timestamp: { type: string, format: date-time }
    DatabaseReadinessResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status, database, timestamp]
          properties:
            status: { const: ready }
            database: { const: ok }
            timestamp: { type: string, format: date-time }
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 32, maxLength: 128 }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
        name: { type: string, minLength: 1, maxLength: 120 }
        locale: { type: string, enum: [en, ru, kk], default: en }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
    RegistrationAccepted:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status: { const: verification_pending }
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id, email, locale, emailVerified]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            name: { type: [string, 'null'], maxLength: 120 }
            locale: { type: string, enum: [en, ru, kk] }
            emailVerified: { type: boolean }
    WorkspaceListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, role, createdAt, updatedAt]
            properties:
              id: { type: string, format: uuid }
              name: { type: string, maxLength: 120 }
              role: { type: string, enum: [owner, admin, operator, auditor] }
              createdAt: { type: string, format: date-time }
              updatedAt: { type: string, format: date-time }
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [workspaceId, name, startMode, locale]
      properties:
        workspaceId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        summary: { type: string, maxLength: 4000 }
        startMode: { type: string, enum: [build, improve, design_implementation, analysis_only] }
        locale: { type: string, enum: [en, ru, kk] }
    Project:
      type: object
      additionalProperties: false
      required: [id, workspaceId, name, startMode, status, locale, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        name: { type: string }
        summary: { type: [string, 'null'] }
        startMode: { type: string, enum: [build, improve, design_implementation, analysis_only] }
        status: { type: string, enum: [draft, active, paused, completed, archived] }
        locale: { type: string, enum: [en, ru, kk] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Project' }
    ProjectListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Project' }
        meta:
          type: object
          additionalProperties: false
          required: [nextCursor]
          properties:
            nextCursor: { type: [string, 'null'] }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        requestId: { type: string, minLength: 1, maxLength: 128 }
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
