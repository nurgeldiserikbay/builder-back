                  properties:
                    title: { type: string, maxLength: 100 }
                    text: { type: string, maxLength: 400 }
              buttonLabel: { type: [string, 'null'], maxLength: 40 }
              imageId:
                type: [string, 'null']
                format: uuid
                description: Photo from the project library (GET /projects/{projectId}/images). Only photos of the same project are rendered.
        seo:
          type: object
          additionalProperties: false
          properties:
            title: { type: string, maxLength: 70 }
