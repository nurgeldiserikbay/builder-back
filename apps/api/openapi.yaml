            draft: { type: boolean }
            versionNumber: { type: [integer, 'null'] }
    ResultResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [generatedAt, complete, openItems, siteReady, files]
          properties:
            generatedAt: { type: string, format: date-time }
            complete: { type: boolean }
            siteReady: { type: boolean }
            openItems: { type: array, items: { type: string } }
            files:
              type: array
              items:
                type: object
                required: [name, mimeType, content]
                properties:
                  name: { type: string, enum: [project.md, site.html, project.json] }
                  mimeType: { type: string }
                  content: { type: string }
    JourneyActionResponse:
      $ref: '#/components/schemas/JourneyResponse'
