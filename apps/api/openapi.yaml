          application/json:
            schema: { type: object, additionalProperties: false, required: [provider, repoUrl, token], properties: { provider: { type: string, enum: [github, gitlab] }, repoUrl: { type: string, maxLength: 500 }, token: { type: string, maxLength: 400, writeOnly: true } } }
      responses:
        '200': { description: Card with the connected repository }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem', description: 'REPO_TOKEN_INVALID, REPO_ACCESS_DENIED, REPO_NOT_FOUND, REPO_WRITE_NOT_ALLOWED, REPO_PROVIDER_UNAVAILABLE' }
        '503': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Choices]
      operationId: disconnectRepository
      summary: Disconnect the repository and delete the stored token
