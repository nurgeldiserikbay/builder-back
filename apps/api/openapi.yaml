            application/json:
              schema: { $ref: '#/components/schemas/AssignmentListResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Specialists]
      operationId: inviteSpecialist
      summary: Invite a specialist to one stage
      description: Creates a 7-day invitation bound to the e-mail address. A lead directs the stage AI and submits for review; a consultant reads and suggests. Specialists never become project members and see only this stage and its accepted inputs. The invite link is returned and e-mailed when Resend is configured.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/StageKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteSpecialistRequest' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteSpecialistResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/assignments/{assignmentId}/revoke:
    post:
      tags: [Specialists]
      operationId: revokeSpecialist
      summary: Revoke a specialist invitation or access
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - in: path
          name: assignmentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Done
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /invites/{token}:
    get:
      tags: [Specialists]
      operationId: getInvite
      summary: What the invitation gives access to (no session needed)
      x-implementation-status: implemented
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, minLength: 20, maxLength: 64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteInfoResponse' }
        '404': { $ref: '#/components/responses/Problem' }
  /invites/{token}/accept:
    post:
      tags: [Specialists]
      operationId: acceptInvite
      summary: Accept an invitation
      description: The signed-in account e-mail must match the invited address.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, minLength: 20, maxLength: 64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteAcceptResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
  /me/assignments:
    get:
      tags: [Specialists]
      operationId: listMyAssignments
      summary: Stages the current account works on as a specialist
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyAssignmentsResponse' }
        '401': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/stages/{stageKey}/submit:
    post:
      tags: [Journey]
      operationId: submitStage
      summary: Send the current version to the owner for acceptance
      description: Lead specialists and contributors only; the stage is read-only while in review. The owner gets a Telegram notice when linked.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/StageKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptStageRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JourneyResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/stages/{stageKey}/request-changes:
    post:
      tags: [Journey]
      operationId: requestStageChanges
      summary: Return a stage in review with a note
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/StageKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestChangesRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JourneyResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/stages/{stageKey}/suggestions:
    post:
      tags: [Journey]
      operationId: suggestStageChange
      summary: Consultant suggestion for the stage AI
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/StageKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuggestionRequest' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuggestionResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/stages/{stageKey}/suggestions/{suggestionId}/{action}:
    post:
      tags: [Journey]
      operationId: resolveSuggestion
      summary: Apply a suggestion as an AI instruction or dismiss it
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/StageKey'
        - in: path
          name: suggestionId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: action
          required: true
          schema: { type: string, enum: [apply, dismiss] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuggestionResolveResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /me/plan:
    get:
      tags: [Plans]
      operationId: getMyPlan
      summary: Current plan, usage against limits and available plans
      description: Limits are counted for the account that owns the projects; AI requests include those made by invited specialists. Template drafts are not counted.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanOverviewResponse' }
        '401': { $ref: '#/components/responses/Problem' }
  /plans:
    get:
      tags: [Plans]
      operationId: listPlans
      summary: Plan catalog with configured prices
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanCatalogResponse' }
  /admin/plan-settings:
    get:
      tags: [Plans]
      operationId: staffGetPlanSettings
      summary: Staff — plan prices and the upgrade contact
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanSettingsResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Plans]
      operationId: staffUpdatePlanSettings
      summary: Staff — change plan prices or the upgrade contact
      description: |
        super_admin only. Each changed price is written to the staff audit history as plan.price_changed, a changed contact as
        billing.contact_changed. Prices are shown to customers; assigned plans are not changed. Omitted fields stay as they are.
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                prices:
                  type: object
                  additionalProperties: false
                  properties:
                    start: { type: [integer, 'null'], minimum: 100, maximum: 10000000 }
                    business: { type: [integer, 'null'], minimum: 100, maximum: 10000000 }
                salesContactUrl:
                  type: [string, 'null']
                  maxLength: 300
                  description: https link (for example a Telegram or WhatsApp chat) or mailto; empty string or null removes it.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanSettingsResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/accounts/plan:
    get:
      tags: [Plans]
      operationId: staffLookupAccountPlan
      summary: Staff — plan and usage of a customer account
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      parameters:
        - in: query
          name: email
          required: true
          schema: { type: string, maxLength: 254 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAccountPlanResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Plans]
      operationId: staffAssignAccountPlan
      summary: Staff — assign a plan after a confirmed payment
      description: super_admin only; written to the staff audit history as account.plan_assigned.
      x-implementation-status: implemented
      security:
        - adminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignPlanRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAccountPlanResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/archive:
    post:
      tags: [Journey]
      operationId: archiveProject
      summary: Move a project to the archive (owner only)
      description: Not allowed while the site is published. Revokes specialist access. Archived projects are read-only and do not count against the projects limit.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JourneyResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/unarchive:
    post:
      tags: [Journey]
      operationId: unarchiveProject
      summary: Restore an archived project (owner only, counts against the plan)
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JourneyResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /legal/consent:
    get:
      tags: [Legal]
      operationId: getConsentStatement
      security: []
      summary: Registration consent text and the current document versions
      x-implementation-status: implemented
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [statement, termsVersion, privacyVersion]
                    properties:
                      statement: { type: string }
                      termsVersion: { type: string }
                      privacyVersion: { type: string }
  /legal/{key}:
    get:
      tags: [Legal]
      operationId: getLegalDocument
      security: []
      summary: Published offer or privacy policy
      description: Markdown with company details and current retention periods filled in. Unset company details are shown as "[будет указано]".
      x-implementation-status: implemented
      parameters:
        - { name: key, in: path, required: true, schema: { type: string, enum: [terms, privacy] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [key, title, version, effectiveDate, markdown]
                    properties:
                      key: { type: string, enum: [terms, privacy] }
                      title: { type: string }
                      version: { type: string }
                      effectiveDate: { type: string, format: date }
                      markdown: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
  /me/consent:
    post:
      tags: [Legal]
      operationId: acceptLegalDocuments
      summary: Accept updated legal documents
      description: The versions must equal the current ones (400 LEGAL_VERSION_OUTDATED otherwise), so a stale page cannot accept newer texts.
      x-implementation-status: implemented
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [termsVersion, privacyVersion]
              properties:
                termsVersion: { type: string, maxLength: 20 }
                privacyVersion: { type: string, maxLength: 20 }
      responses:
        '204': { description: Recorded }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /me/deletion:
    get:
      tags: [Account]
      operationId: previewAccountDeletion
      summary: What deleting the account will do
      x-implementation-status: implemented
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [projects, liveSites, specialistStages, telegramLinked, retentionDays, purgeAfter]
                    properties:
                      projects: { type: integer }
                      liveSites: { type: array, items: { type: object, properties: { slug: { type: string }, projectName: { type: string } } } }
                      specialistStages: { type: integer, description: Active or invited stages on other people's projects }
                      telegramLinked: { type: boolean }
                      retentionDays: { type: integer }
                      purgeAfter: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Account]
      operationId: deleteAccount
      summary: Delete the signed-in account
      description: |
        Requires the password. Immediately: all sessions revoked (the cookie is cleared), live sites unpublished, specialists and members
        lose access to the user's projects, the user's own stage assignments revoked (owners see specialist_account_deleted), Telegram unlinked.
        Data is kept for the retention period from privacy settings (1–90 days, default 30) so staff can restore the account, then purged
        by the API process (hourly). Login during that period answers 403 ACCOUNT_DELETED.
      x-implementation-status: implemented
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password, confirm]
              properties:
                password: { type: string, maxLength: 128, writeOnly: true }
                confirm: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Deletion recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deletionRequestedAt: { type: string, format: date-time }
                      purgeAfter: { type: string, format: date-time }
                      retentionDays: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem', description: 'SESSION_INVALID or INVALID_PASSWORD' }
  /admin/privacy-settings:
    get:
      tags: [Account]
      operationId: staffGetPrivacySettings
      summary: Staff — retention period after account deletion
      x-implementation-status: implemented
      security: [{ adminSessionCookie: [] }]
      responses:
        '200': { description: 'accountRetentionDays, minDays, maxDays, pendingDeletions, updatedAt, legalVersions' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Account]
      operationId: staffUpdatePrivacySettings
      summary: Staff — change the retention period
      description: super_admin only; audited as privacy.retention_changed. Applies to accounts already waiting for deletion (purge time = deletion time + current period).
      x-implementation-status: implemented
      security: [{ adminSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accountRetentionDays]
              properties:
                accountRetentionDays: { type: integer, minimum: 1, maximum: 90 }
      responses:
        '200': { description: Updated settings }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/accounts/status:
    get:
      tags: [Account]
      operationId: staffAccountStatus
      summary: Staff — deletion and consent status of an account
      x-implementation-status: implemented
      security: [{ adminSessionCookie: [] }]
      parameters:
        - { name: email, in: query, required: true, schema: { type: string, maxLength: 254 } }
      responses:
        '200': { description: 'userId, email, deletionRequestedAt, purgeAfter, consent (versions and time of the latest acceptance)' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/accounts/restore:
    post:
      tags: [Account]
      operationId: staffRestoreAccount
      summary: Staff — cancel a pending account deletion
      description: super_admin only; audited as account.deletion_cancelled. Sites stay unpublished and specialists are not re-invited.
      x-implementation-status: implemented
      security: [{ adminSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [email], properties: { email: { type: string, maxLength: 254 } } }
      responses:
        '200': { description: Account status after restore }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: buildpath_admin_session
    sessionCookie:
      type: apiKey
      in: cookie
      name: buildpath_session
  parameters:
    StageKey:
      in: path
      name: stageKey
      required: true
      schema: { type: string, enum: [goal, process, offer, products, schedule, sitemap, techplan, content, design, build] }
    RuleId:
      in: path
      name: ruleId
      required: true
      schema: { type: string, format: uuid }
    VersionId:
      in: path
      name: versionId
      required: true
      schema: { type: string, format: uuid }
    OptionalVersionId:
      in: query
      name: versionId
      required: false
      description: Saved build version; omitted for a draft preview from the latest drafts.
      schema: { type: string, format: uuid }
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: { type: string, format: uuid }
    ReviewId:
      in: path
      name: reviewId
      required: true
      schema: { type: string, format: uuid }
    PageId:
      in: path
      name: pageId
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Replaying the same key and body returns the original result; reusing it with a different body returns 409.
      schema: { type: string, minLength: 16, maxLength: 128 }
  responses:
    Problem:
      description: RFC 9457 problem response with stable application code and request ID.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    HistoryPerson:
      type: object
      required: [id, name, kind]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: Name or e-mail; for a specialist viewer other people are shown as roles }
        kind: { type: string, enum: [you, owner, member, specialist, former] }
    ProjectImage:
      type: object
      required: [id, width, height, sizeBytes, alt, createdAt, inUse]
      properties:
        id: { type: string, format: uuid }
        width: { type: integer }
        height: { type: integer }
        sizeBytes: { type: integer }
        alt: { type: string }
        createdAt: { type: string, format: date-time }
        inUse: { type: boolean, description: Shown by the current or accepted texts }
    ProjectImageResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ProjectImage' }
    ProjectImageListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, limit]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/ProjectImage' } }
            limit: { type: integer }
    QualityGateReport:
      type: object
      additionalProperties: false
      required: [status, profile, evaluatedAt, requirementCoverage, apiChecks, categories, blockingReasons]
      properties:
        status: { type: string, enum: [not_configured, invalid_configuration, not_assessed, blocked, passed] }
        profile:
          oneOf:
            - type: object
              additionalProperties: false
              required: [key, name, version]
              properties:
                key: { type: string, maxLength: 80 }
                name: { type: string, maxLength: 120 }
                version: { type: integer, minimum: 1 }
            - type: 'null'
        evaluatedAt: { type: string, format: date-time }
        requirementCoverage:
          type: object
          additionalProperties: false
          required: [status, actualPercent, minimumPercent]
          properties:
            status: { type: string, enum: [not_applicable, passed, blocked] }
            actualPercent: { type: [integer, 'null'], minimum: 0, maximum: 100 }
            minimumPercent: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        apiChecks:
          type: object
          additionalProperties: false
          required: [checked, failed]
          properties:
            checked: { type: integer, minimum: 0, maximum: 5000 }
            failed: { type: integer, minimum: 0, maximum: 5000 }
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, enabled, required, status, evidence, issues, reasons]
            properties:
              id: { type: string, enum: [security, accessibility, performance, seo] }
              enabled: { type: boolean }
              required: { type: boolean }
