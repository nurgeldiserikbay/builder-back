        audience: { type: string, maxLength: 300 }
        city: { type: [string, 'null'], maxLength: 80 }
        mainAction: { type: [string, 'null'], enum: [call, message, visit, email, form, null] }
        phone: { type: [string, 'null'], maxLength: 30 }
        messenger: { type: [string, 'null'], maxLength: 60 }
        email: { type: [string, 'null'], maxLength: 120 }
        address: { type: [string, 'null'], maxLength: 160 }
        tone: { type: [string, 'null'], enum: [friendly, formal, bold, null] }
    OfferArtifact:
      type: object
