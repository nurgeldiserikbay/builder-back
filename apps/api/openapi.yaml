openapi: 3.1.0
info:
  title: BuildPath API
  version: 1.8.0
  description: |
    Contract-first API for BuildPath. This document is the source of truth for
    request and response shapes. An operation marked planned is not implemented
    until its behavior is verified in the API.
servers:
  - url: http://localhost:4000/api/v1
tags:
  - name: Health
  - name: Authentication
  - name: Workspaces
  - name: Projects
  - name: Reviews
  - name: Capabilities
  - name: QualityProfiles
  - name: Journey
paths:
  /admin/auth/login:
    post:
      tags: [Authentication]
      operationId: staffLogin
      summary: Start an internal staff session
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffLoginRequest' }
      responses:
        '200':
          description: Staff identity and an HTTP-only admin session cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffIdentityResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /admin/auth/me:
    get:
      tags: [Authentication]
      operationId: getStaffIdentity
      summary: Read the current staff identity
      x-implementation-status: implemented
      security: [{ adminSessionCookie: [] }]
      responses:
        '200':
          description: Current staff identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffIdentityResponse' }
        '401': { $ref: '#/components/responses/Problem' }
  /admin/auth/logout:
    post:
      tags: [Authentication]
      operationId: staffLogout
      summary: Revoke the current staff session
      x-implementation-status: implemented
      security: [{ adminSessionCookie: [] }]
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Problem' }
  /admin/quality-profiles:
    get:
      tags: [QualityProfiles]
      operationId: listQualityProfiles
      summary: List versioned quality profiles for staff
      x-implementation-status: implemented
      security: [{ adminSessionCookie: [] }]
      responses:
        '200':
          description: Quality profile catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityProfileListResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [QualityProfiles]
      operationId: createQualityProfile
      summary: Create a quality profile with its first draft version
      x-implementation-status: implemented
      security: [{ adminSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QualityProfileCreateRequest' }
      responses:
        '201': { description: Draft profile created }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/quality-profiles/{profileKey}:
    get:
      tags: [QualityProfiles]
      operationId: getQualityProfile
      summary: Read a quality profile and its version history
      x-implementation-status: implemented
      security: [{ adminSessionCookie: [] }]
      parameters:
        - in: path
          name: profileKey
          required: true
          schema: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200':
          description: Quality profile, version history, and saved policy snapshots
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityProfileResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/quality-profiles/{profileKey}/default:
    put:
      tags: [QualityProfiles]
      operationId: setDefaultQualityProfile
      summary: Select the default profile used by new reviews
      x-implementation-status: implemented
      security: [{ adminSessionCookie: [] }]
      parameters:
        - in: path
          name: profileKey
          required: true
          schema: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200': { description: Default profile changed }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/quality-profiles/{profileKey}/versions:
    post:
      tags: [QualityProfiles]
      operationId: createQualityProfileVersion
      summary: Create a draft copied from the active version
      x-implementation-status: implemented
      security: [{ adminSessionCookie: [] }]
      parameters:
        - in: path
          name: profileKey
          required: true
          schema: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201': { description: Draft version created }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/quality-profiles/{profileKey}/versions/{version}:
    patch:
      tags: [QualityProfiles]
      operationId: updateQualityProfileDraft
      summary: Update the policy of a draft version
      x-implementation-status: implemented
      security: [{ adminSessionCookie: [] }]
      parameters:
        - in: path
          name: profileKey
          required: true
          schema: { type: string, minLength: 1, maxLength: 80 }
        - in: path
          name: version
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QualityPolicyRequest' }
      responses:
        '200': { description: Draft updated }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/quality-profiles/{profileKey}/versions/{version}/activate:
    post:
      tags: [QualityProfiles]
      operationId: activateQualityProfileVersion
      summary: Activate a draft or restore a retired profile version
      x-implementation-status: implemented
      security: [{ adminSessionCookie: [] }]
      parameters:
        - in: path
          name: profileKey
          required: true
          schema: { type: string, minLength: 1, maxLength: 80 }
        - in: path
          name: version
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: Version activated }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/capabilities:
    get:
      tags: [Capabilities]
      operationId: getAdminCapabilityManifest
      summary: Read capability manifest in the staff console
      x-implementation-status: implemented
      security: [{ adminSessionCookie: [] }]
      responses:
        '200':
          description: Capability catalog for authenticated staff
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityManifestResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /capabilities:
    get:
      tags: [Capabilities]
      operationId: getCapabilityManifest
      summary: Read the versioned platform capability manifest
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: Deterministic capability manifest for current platform support
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityManifestResponse'
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check API process health
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: API process is accepting requests; this does not assert database/provider readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check whether the API can access required database state
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: API process and PostgreSQL are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseReadinessResponse'
        '503':
          description: PostgreSQL is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Create an account and begin email verification
      description: Requires configured Resend email delivery. Does not create a session until email is verified.
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Verification message accepted; response does not reveal whether an email already has an account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAccepted'
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /auth/verify-email:
    post:
      tags: [Authentication]
      operationId: verifyEmail
      summary: Verify an account email address
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204': { description: Email verified }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Sign in to a verified account
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session established using a secure HTTP-only cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Secure, HTTP-only, SameSite cookie; never expose session tokens in JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current session
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Problem' }
  /me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get the signed-in account
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: List workspaces available to the current account
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Active workspace memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceListResponse'
        '401': { $ref: '#/components/responses/Problem' }
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects available to the current account
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 512 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Bounded project page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a private project in a workspace
      description: Requires active workspace owner, admin, or operator membership. Creator becomes project owner.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}:
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project the current account may access
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}/reviews:
    post:
      tags: [Reviews]
      operationId: createReview
      summary: Create a read-only site review
      description: Creates a review in the current project. Replaying the same idempotency key and request returns the original review for 30 days.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /reviews/{reviewId}:
    get:
      tags: [Reviews]
      operationId: getReview
      summary: Get review progress and configuration
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: Review state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /reviews/{reviewId}/sources/url:
    post:
      tags: [Reviews]
      operationId: registerReviewUrl
      summary: Add a website URL for analysis
      description: Validates the initial target against the SSRF policy and persists a discovery job for a separate worker. The API does not fetch the site itself. Redirects must be revalidated by the worker.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterReviewUrlRequest'
      responses:
        '202':
          description: Target validated and a discovery job persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewSourceAccepted'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /integrations/figma/status:
    get:
      tags: [Reviews]
      operationId: getFigmaConnectionStatus
      summary: Get the current user's Figma connection status
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Figma connection status without exposing credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigmaConnectionStatusResponse'
        '401': { $ref: '#/components/responses/Problem' }
  /integrations/figma/connect:
    post:
      tags: [Reviews]
      operationId: startFigmaConnection
      summary: Start a PKCE-protected Figma OAuth flow
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '201':
          description: Short-lived authorization URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigmaAuthorizationResponse'
        '401': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /integrations/figma/callback:
    post:
      tags: [Reviews]
      operationId: completeFigmaConnection
      summary: Exchange a Figma authorization code and store encrypted credentials
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FigmaCallbackRequest'
      responses:
        '201':
          description: Figma account connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigmaConnectedResponse'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /integrations/figma/connection:
    delete:
      tags: [Reviews]
      operationId: disconnectFigma
      summary: Remove the current user's Figma connection
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Figma connection removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigmaConnectedResponse'
        '401': { $ref: '#/components/responses/Problem' }
  /reviews/{reviewId}/sources/figma-import:
    post:
      tags: [Reviews]
      operationId: importFigmaFrame
      summary: Export a Figma frame into private verified design storage
      description: The frame is fetched through the user's Figma OAuth connection, stored privately, scanned, and mapped to the selected review page.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FigmaFrameImportRequest'
      responses:
        '201':
          description: Verified Figma frame mapped to the page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigmaFrameImportResponse'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /reviews/{reviewId}/sources/design-upload:
    post:
      tags: [Reviews]
      operationId: requestDesignUpload
      summary: Request a private signed upload for a page design
      description: Returns a short-lived upload target after validating file metadata. The client uploads bytes directly to private object storage, then calls the completion operation.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DesignUploadRequest'
      responses:
        '201':
          description: Private upload reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignUploadResponse'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /reviews/{reviewId}/sources/design-upload/{assetId}/complete:
    post:
      tags: [Reviews]
      operationId: completeDesignUpload
      summary: Verify an uploaded design asset
      description: Checks file signature, checksum, malware scan state, and project access before the asset can be mapped to a page.
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - in: path
          name: assetId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Verified design asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignAssetResponse'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /reviews/{reviewId}/sources/design-upload/{assetId}/url:
    get:
      tags: [Reviews]
      operationId: getDesignAssetUrl
      summary: Get a short-lived URL for a verified design image
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - in: path
          name: assetId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Authorized temporary image URL
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [url, expiresInSeconds]
                    properties:
                      url: { type: string, format: uri }
                      expiresInSeconds: { type: integer, enum: [300] }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /reviews/{reviewId}/pages/discover:
    post:
      tags: [Reviews]
      operationId: discoverReviewPages
      summary: Queue bounded same-origin page discovery
      description: Discovery uses only the validated review origin, follows bounded redirects and page/depth limits, and runs in an isolated worker with restricted egress.
      x-implementation-status: planned
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverPagesRequest'
      responses:
        '202':
          description: Discovery job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewJobAccepted'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /reviews/{reviewId}/pages:
    get:
      tags: [Reviews]
      operationId: listReviewPages
      summary: List discovered or manually added pages
      x-implementation-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: Review pages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPageListResponse'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /reviews/{reviewId}/page-mappings/{pageId}:
