      description: |
        The chosen code_hosting option must match the provider. The address is parsed from what the user copied (GitHub only on github.com;
        GitLab on gitlab.com or an own server, which must resolve to public addresses). The token is checked against the provider; the
        connection is stored only when writing is allowed (422 REPO_WRITE_NOT_ALLOWED otherwise). The token is encrypted with
