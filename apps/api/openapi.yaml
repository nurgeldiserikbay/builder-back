      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
    RegistrationAccepted:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status: { const: verification_pending }
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id, email, locale, emailVerified, consentRequired]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            name: { type: [string, 'null'], maxLength: 120 }
            locale: { type: string, enum: [en, ru, kk] }
            emailVerified: { type: boolean }
            consentRequired:
              type: boolean
              description: True when the current offer/privacy versions are not accepted. Until POST /me/consent, other signed-in routes answer 403 CONSENT_REQUIRED (except /me, /me/deletion, /auth/logout).
    WorkspaceListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, role, createdAt, updatedAt]
            properties:
              id: { type: string, format: uuid }
              name: { type: string, maxLength: 120 }
              role: { type: string, enum: [owner, admin, operator, auditor] }
              createdAt: { type: string, format: date-time }
              updatedAt: { type: string, format: date-time }
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [workspaceId, name, startMode, locale]
      properties:
        workspaceId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        summary: { type: string, maxLength: 4000 }
        startMode: { type: string, enum: [build, improve, design_implementation, analysis_only] }
        locale: { type: string, enum: [en, ru, kk] }
        projectType:
          type: string
          enum: [landing, company_site, multipage, store, booking]
          description: Creates the stage route from the versioned journey catalog and makes the project active.
        startStageKey:
          type: string
          enum: [goal, offer, content, design, build]
          description: Optional later starting stage; it and its earlier stages open so the owner can bring ready materials. Requires projectType.
    Project:
      type: object
      additionalProperties: false
      required: [id, workspaceId, name, startMode, status, locale, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        name: { type: string }
        summary: { type: [string, 'null'] }
        startMode: { type: string, enum: [build, improve, design_implementation, analysis_only] }
        status: { type: string, enum: [draft, active, paused, completed, archived, live] }
        locale: { type: string, enum: [en, ru, kk] }
        projectType: { type: [string, 'null'], enum: [landing, company_site, multipage, store, booking, null] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectResponse:
      type: object
      additionalProperties: false
