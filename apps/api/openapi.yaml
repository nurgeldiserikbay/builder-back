openapi: 3.1.0
info:
  title: BuildPath API
  version: 1.0.0
  description: |
    Contract-first API for BuildPath. This document is the source of truth for
    request and response shapes. An operation marked planned is not implemented
    until its behavior is verified in the API.
servers:
  - url: http://localhost:4000/api/v1
tags:
  - name: Health
  - name: Authentication
  - name: Projects
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check API process health
      x-implementation-status: implemented
      security: []
      responses:
        '200':
          description: API process is accepting requests; this does not assert database/provider readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Create an account and begin email verification
      description: Rate limited. Does not create a session until email is verified.
      x-implementation-status: planned
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Verification message accepted; response does not reveal whether an email already has an account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAccepted'
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Sign in to a verified account
      x-implementation-status: planned
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session established using a secure HTTP-only cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: Secure, HTTP-only, SameSite cookie; never expose session tokens in JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current session
      x-implementation-status: planned
      security:
        - sessionCookie: []
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Problem' }
  /me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get the signed-in account
      x-implementation-status: planned
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects available to the current account
      x-implementation-status: planned
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: workspaceId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 512 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Bounded project page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a private project in a workspace
      description: Requires active workspace membership with project creation permission. Emits an audit event.
      x-implementation-status: planned
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /projects/{projectId}:
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project the current account may access
      x-implementation-status: planned
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: buildpath_session
  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Replaying the same key and body returns the original result; reusing it with a different body returns 409.
      schema: { type: string, minLength: 16, maxLength: 128 }
  responses:
    Problem:
      description: RFC 9457 problem response with stable application code and request ID.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status, timestamp]
          properties:
            status: { const: ok }
            timestamp: { type: string, format: date-time }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, locale]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
        locale: { type: string, enum: [en, ru, kk] }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
    RegistrationAccepted:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status: { const: verification_pending }
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [id, email, locale, emailVerified]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            name: { type: [string, 'null'], maxLength: 120 }
            locale: { type: string, enum: [en, ru, kk] }
            emailVerified: { type: boolean }
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [workspaceId, name, startMode, locale]
      properties:
        workspaceId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        summary: { type: string, maxLength: 4000 }
        startMode: { type: string, enum: [build, improve, design_implementation, analysis_only] }
        locale: { type: string, enum: [en, ru, kk] }
    Project:
      type: object
      additionalProperties: false
      required: [id, workspaceId, name, startMode, status, locale, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        name: { type: string }
        summary: { type: [string, 'null'] }
        startMode: { type: string, enum: [build, improve, design_implementation, analysis_only] }
        status: { type: string, enum: [draft, active, paused, completed, archived] }
        locale: { type: string, enum: [en, ru, kk] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Project' }
    ProjectListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Project' }
        meta:
          type: object
          additionalProperties: false
          required: [nextCursor]
          properties:
            nextCursor: { type: [string, 'null'] }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        requestId: { type: string, minLength: 1, maxLength: 128 }
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
