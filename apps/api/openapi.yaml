            version: { type: string }
            projectTypes:
              type: array
              items:
                type: object
                required: [key, title, description, stages]
                properties:
                  key: { type: string, enum: [landing, company_site, multipage, store, booking] }
                  title: { type: string }
                  description: { type: string }
                  goodFor: { type: string }
                  examples: { type: array, items: { type: string } }
                  resultExplanation: { type: string }
                  stages:
                    type: array
                    items:
                      type: object
                      required: [key, title, outcome]
                      properties:
                        key: { type: string }
                        title: { type: string }
                        outcome: { type: string }
                        importHint: { type: [string, 'null'] }
    JourneyResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [project, progress, nextAction, stages, ai]
          properties:
            project:
              type: object
              required: [id, name, status, projectType, typeTitle, role]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                status: { type: string, enum: [draft, active, paused, completed, archived, live] }
                locale: { type: string, enum: [en, ru, kk] }
                role: { type: string }
                projectType: { type: string }
                typeTitle: { type: string }
                resultExplanation: { type: string }
                startStageKey: { type: [string, 'null'] }
                routeVersion: { type: [string, 'null'] }
            progress:
              type: object
              required: [accepted, total, percent]
              properties:
                accepted: { type: integer }
                total: { type: integer }
                percent: { type: integer, description: 'Share of accepted, imported or skipped stages in the route.' }
            nextAction:
              type: object
              required: [stageKey, title, text]
              properties:
                stageKey: { type: [string, 'null'] }
                title: { type: string }
                text: { type: string }
            stages:
              type: array
              items:
                type: object
                required: [key, title, status, statusLabel, inputs]
                properties:
                  key: { type: string }
                  title: { type: string }
                  purpose: { type: string }
                  outcome: { type: string }
                  aiLevel: { type: string, enum: [ai_full, ai_draft, ai_assist, none] }
                  status: { $ref: '#/components/schemas/StageStatus' }
                  statusLabel: { type: string }
                  statusExplanation: { type: string }
                  inputs:
                    type: array
                    items:
                      type: object
                      required: [key, title, satisfied]
                      properties:
                        key: { type: string }
                        title: { type: string }
                        satisfied: { type: boolean }
                  currentVersionNumber: { type: [integer, 'null'] }
                  acceptedVersionNumber: { type: [integer, 'null'] }
                  acceptedAt: { type: [string, 'null'], format: date-time }
                  updatedAt: { type: string, format: date-time }
                  people:
                    type: object
                    description: Who works on the stage, for the project map. A specialist viewer sees only "you".
                    properties:
                      lead:
                        type: object
                        properties:
                          kind: { type: string, enum: [owner, specialist, invited, you] }
                          name: { type: [string, 'null'] }
                      consultants: { type: integer }
                  changes:
                    type: object
                    description: Undecided change notices where this stage is built on a changed stage (incoming) or is the changed one (outgoing).
                    properties:
                      incoming: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, sourceKey: { type: string }, status: { type: string, enum: [open, discussing] } } } }
                      outgoing: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, targetKey: { type: string }, status: { type: string, enum: [open, discussing] } } } }
                  needsYou:
                    type: [string, 'null']
                    description: Short reason when the viewer must act on this stage (accept, confirm a changed input, continue); null otherwise.
            ai:
              type: object
              required: [configured, remainingToday]
              properties:
                configured: { type: boolean }
                provider: { type: [string, 'null'] }
                remainingToday: { type: integer }
    StageResponse:
      type: object
      required: [data]
      description: Stage contract with plain-language explanations, accepted inputs, the current draft (build stage returns checks without HTML), version provenance, standing rules and presentation options.
      properties:
        data:
          type: object
          required: [stage, inputs, current, issues, versions, rules, ai, options]
          properties:
            stage:
              type: object
              required: [key, title, status, artifactType, canEdit, canAccept, canReopen, canImport, inputsReady, lockedKeys]
              properties:
                key: { type: string }
                title: { type: string }
                purpose: { type: string }
                outcome: { type: string }
                artifactType: { type: string, enum: [brief, offer, content, design, site] }
                status: { $ref: '#/components/schemas/StageStatus' }
                statusLabel: { type: string }
                statusExplanation: { type: string }
                acceptance: { type: array, items: { type: string } }
                acceptExplanation: { type: string }
                importHint: { type: [string, 'null'] }
                fields: { type: [array, 'null'], items: { type: object } }
                lockedKeys: { type: array, items: { type: string } }
                acceptedVersionId: { type: [string, 'null'], format: uuid }
                canEdit: { type: boolean }
                canAccept: { type: boolean }
                canReopen: { type: boolean }
                canImport: { type: boolean }
                inputsReady: { type: boolean }
            inputs: { type: array, items: { type: object } }
            current:
              type: [object, 'null']
              properties:
                id: { type: string, format: uuid }
                versionNumber: { type: integer }
                origin: { type: string, enum: [owner_edit, ai_generated, template, imported, compiled, restored] }
                note: { type: [string, 'null'] }
                createdAt: { type: string, format: date-time }
                content: { type: object }
            issues:
              type: array
              items:
                type: object
                required: [key, message]
                properties:
                  key: { type: string }
                  message: { type: string }
            versions:
              type: array
              items:
                type: object
                required: [id, versionNumber, origin, accepted]
                properties:
                  id: { type: string, format: uuid }
                  versionNumber: { type: integer }
                  origin: { type: string }
                  note: { type: [string, 'null'] }
                  createdAt: { type: string, format: date-time }
                  accepted: { type: boolean }
                  provenance:
                    type: [object, 'null']
                    properties:
                      provider: { type: string }
                      model: { type: [string, 'null'] }
                      instruction: { type: [string, 'null'] }
                      targetKey: { type: [string, 'null'] }
                      rulesApplied: { type: integer }
            rules: { type: array, items: { $ref: '#/components/schemas/StageRule' } }
            ai: { type: object }
            options: { type: object }
    StageRule:
      type: object
      required: [id, kind, status, text, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [stage_rule, project_rule] }
        status: { type: string, enum: [active, disabled] }
        text: { type: string }
        createdAt: { type: string, format: date-time }
    StageRuleResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/StageRule' }
    StageRuleStatusResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [active, disabled] }
    StageVersionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [versionId, versionNumber]
          properties:
            versionId: { type: string, format: uuid }
            versionNumber: { type: integer }
            provider: { type: string }
            changed: { type: array, items: { type: string } }
    StageLocksResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [lockedKeys]
          properties:
            lockedKeys: { type: array, items: { type: string } }
    StageImportResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [versionId, versionNumber, status, issues]
          properties:
            versionId: { type: string, format: uuid }
