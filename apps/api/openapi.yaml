      responses:
        '200': { description: 'folder, kind and files. kind static — site/index.html, Caddyfile (automatic HTTPS), compose.yaml, README.md. kind booking_app (online booking route) — app/server.mjs (bundled booking program, Node.js 22+), app/config.json, app/index.html, Caddyfile (reverse proxy), compose.yaml, .env.example, README.md.' }
