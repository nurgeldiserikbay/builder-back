services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: buildpath
      POSTGRES_PASSWORD: buildpath
      POSTGRES_DB: buildpath
    ports:
      - "5432:5432"
    volumes:
      - buildpath_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildpath -d buildpath"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  buildpath_postgres_data:
