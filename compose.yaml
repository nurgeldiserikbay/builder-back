services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: buildpath
      POSTGRES_PASSWORD: buildpath
      POSTGRES_DB: buildpath
    ports:
      - "5432:5432"
    volumes:
      - buildpath_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildpath -d buildpath"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: buildpath
      MINIO_ROOT_PASSWORD: buildpathsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - buildpath_minio_data:/data
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      until mc alias set local http://minio:9000 buildpath buildpathsecret; do sleep 2; done;
      mc mb --ignore-existing local/buildpath-designs;
      mc cors set local/buildpath-designs /etc/minio/design-assets-cors.xml
    volumes:
      - ./infra/minio/design-assets-cors.xml:/etc/minio/design-assets-cors.xml:ro
    restart: "no"

  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"
    volumes:
      - buildpath_clamav_data:/var/lib/clamav

volumes:
  buildpath_postgres_data:
  buildpath_minio_data:
  buildpath_clamav_data:
